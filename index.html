<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免扫地云管理系统</title>
    <!-- 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    
    <!-- 数据库库 完整UMD路径 绝对不会404 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
    
    <!-- 二维码相关库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: "Segoe UI", system-ui, sans-serif;}
        body {
            background: #0f172a;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(59,130,246,0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(139,92,246,0.12) 0%, transparent 45%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .glass-card {
            background: rgba(15,23,42,0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99,102,241,0.25);
            box-shadow: 0 0 30px rgba(79,70,229,0.15);
            border-radius: 18px;
            padding: 28px;
        }
        .neon-title {
            text-shadow: 0 0 8px #6366f1, 0 0 16px #818cf8;
            letter-spacing: 1px;
        }
        .tech-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(30,41,59,0.8);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
        }
        .tech-input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129,140,248,0.2);
        }
        .tech-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(79,70,229,0.3);
        }
        .tech-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79,70,229,0.45);
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .menu-item {
            padding: 24px 16px;
            border-radius: 14px;
            background: rgba(30,41,59,0.6);
            border: 1px solid rgba(99,102,241,0.2);
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
        }
        .menu-item:hover {
            background: rgba(49,57,83,0.7);
            border-color: #818cf8;
            transform: translateY(-3px);
        }
        .menu-item i {
            font-size: 28px;
            margin-bottom: 8px;
            color: #818cf8;
        }
        .list-row {
            padding: 12px;
            border-bottom: 1px solid rgba(99,102,241,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-ok {color: #34d399;}
        .status-used {color: #f87171;}
        .del-btn {
            color: #f87171;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
        }
        .del-btn:hover {background: rgba(248,113,113,0.15);}
        .tip-ok {color: #34d399; text-align: center; padding: 10px;}
        .tip-err {color: #f87171; text-align: center; padding: 10px;}
        .hidden {display: none !important;}
        .back-btn {
            margin-bottom: 16px;
            display: inline-block;
            padding: 8px 16px;
            background: #334155;
            border-radius: 8px;
            cursor: pointer;
        }
        #reader {width: 100%; max-width: 400px; margin: 0 auto;}
        .code-card {
            background: #fff;
            color: #111;
            border-radius: 12px;
            padding: 16px;
            width: 220px;
            text-align: center;
            margin: 10px;
            display: inline-block;
        }
        .qrcode-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }
        .code-text {
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            word-break: break-all;
        }
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        /* ===== 生成信息管理页样式 ===== */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: rgba(30,41,59,0.6);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
        }
        .stat-box .num {
            font-size: 24px;
            font-weight: 700;
            color: #818cf8;
            line-height: 1.2;
        }
        .stat-box .lab {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .mini-btn {
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid rgba(99,102,241,0.3);
            background: rgba(51,65,85,0.6);
            color: #cbd5e1;
            transition: all 0.2s;
            white-space: nowrap;
            display: inline-block;
        }
        .mini-btn:hover {
            border-color: #818cf8;
            color: #fff;
            background: rgba(79,70,229,0.25);
        }
        .mini-btn.danger {
            color: #f87171;
            border-color: rgba(248,113,113,0.35);
        }
        .mini-btn.danger:hover {
            background: rgba(248,113,113,0.15);
            color: #fca5a5;
        }
        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .badge-ok { background: rgba(52,211,153,0.15); color: #34d399; }
        .badge-used { background: rgba(248,113,113,0.15); color: #f87171; }
        .qr-row {
            padding: 12px;
            margin: 8px 0;
            background: #fff;
            border-radius: 12px;
            text-align: center;
        }
        .qr-row .code-text { color: #111; margin-top: 8px; }
        #gm-filter option { background: #1e293b; color: #f1f5f9; }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div id="page-login" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md">
            <div class="text-center mb-8">
                <div class="text-4xl mb-3">🔐</div>
                <h2 class="text-2xl font-bold neon-title">云端管理系统</h2>
                <p class="text-sm text-slate-400 mt-2">请输入访问密码验证身份</p>
            </div>
            <input type="password" id="pwd-input" class="tech-input mb-4" placeholder="输入访问密码">
            <button id="login-btn" class="tech-btn">
                <i class="fa fa-shield"></i> 身份验证
            </button>
            <div id="login-tip" class="tip-err mt-3 hidden">密码错误，请重试</div>
        </div>
    </div>

    <!-- 主菜单 -->
    <div id="page-menu" class="hidden p-4 md:p-8">
        <div class="max-w-5xl mx-auto">
            <div class="glass-card mb-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-xl font-bold neon-title"><i class="fa fa-cube"></i> 免扫地云管理系统</h1>
                    <button id="logout-btn" class="px-4 py-2 bg-red-600 rounded-lg text-sm">退出登录</button>
                </div>
            </div>
            <div class="menu-grid">
                <div class="menu-item" data-goto="redeem">
                    <i class="fa fa-gift"></i>
                    <div>兑换码兑换</div>
                </div>
                <div class="menu-item" data-goto="generate">
                    <i class="fa fa-key"></i>
                    <div>生成兑换码</div>
                </div>
                <div class="menu-item" data-goto="record">
                    <i class="fa fa-history"></i>
                    <div>兑换记录</div>
                </div>
                <div class="menu-item" data-goto="clean">
                    <i class="fa fa-users"></i>
                    <div>免扫地人员表</div>
                </div>
                <div class="menu-item" data-goto="scan">
                    <i class="fa fa-qrcode"></i>
                    <div>扫码兑换</div>
                </div>
                <div class="menu-item" data-goto="genmanage">
                    <i class="fa fa-database"></i>
                    <div>生成信息管理</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 兑换码兑换页 -->
    <div id="page-redeem" class="hidden p-4 md:p-8">
        <div class="max-w-3xl mx-auto">
            <div class="back-btn" data-back="menu"><i class="fa fa-arrow-left"></i> 返回菜单</div>
            <div class="glass-card">
                <h3 class="text-lg font-semibold mb-4 neon-title">兑换码核验</h3>
                <input id="redeem-input" class="tech-input mb-4" placeholder="请输入兑换密钥">
                <button id="redeem-btn" class="tech-btn"><i class="fa fa-check-circle"></i> 立即兑换</button>
                <div id="redeem-tip" class="mt-4"></div>
            </div>
        </div>
    </div>

    <!-- 生成兑换码页 -->
    <div id="page-generate" class="hidden p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            <div class="back-btn" data-back="menu"><i class="fa fa-arrow-left"></i> 返回菜单</div>
            <div class="glass-card">
                <h3 class="text-lg font-semibold mb-4 neon-title">创建新兑换密钥</h3>
                <div class="space-y-4 mb-4">
                    <input id="reward-input" class="tech-input" placeholder="奖励内容（如：免扫地一次）">
                    <div class="flex gap-3">
                        <input id="count-input" type="number" value="1" min="1" max="10" class="tech-input w-24">
                        <button id="gen-btn" class="tech-btn flex-1"><i class="fa fa-magic"></i> 一键生成</button>
                    </div>
                </div>
                <div id="gen-tip" class="mb-4"></div>
                <h4 class="font-semibold mb-2 text-sm text-slate-300">生成卡片（上方二维码，下方兑换码）</h4>
                <div id="card-list" class="card-grid"></div>
            </div>
        </div>
    </div>

    <!-- 兑换记录页 -->
    <div id="page-record" class="hidden p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            <div class="back-btn" data-back="menu"><i class="fa fa-arrow-left"></i> 返回菜单</div>
            <div class="glass-card">
                <h3 class="text-lg font-semibold mb-4 neon-title">兑换记录</h3>
                <div id="record-list" class="bg-slate-900/60 rounded-xl max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- 免扫地人员页 -->
    <div id="page-clean" class="hidden p-4 md:p-8">
        <div class="max-w-3xl mx-auto">
            <div class="back-btn" data-back="menu"><i class="fa fa-arrow-left"></i> 返回菜单</div>
            <div class="glass-card">
                <h3 class="text-lg font-semibold mb-4 neon-title">免扫地人员管理</h3>
                <div class="flex gap-3 mb-4">
                    <input id="name-input" class="tech-input flex-1" placeholder="输入人员姓名">
                    <button id="add-name-btn" class="tech-btn w-auto px-6"><i class="fa fa-plus"></i> 添加</button>
                </div>
                <div id="name-list" class="bg-slate-900/60 rounded-xl max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- 扫码兑换页 -->
    <div id="page-scan" class="hidden p-4 md:p-8">
        <div class="max-w-3xl mx-auto">
            <div class="back-btn" data-back="menu"><i class="fa fa-arrow-left"></i> 返回菜单</div>
            <div class="glass-card">
                <h3 class="text-lg font-semibold mb-4 neon-title">扫码兑换</h3>
                <div id="reader"></div>
                <div id="scan-tip" class="mt-4"></div>
                <button id="scan-stop-btn" class="tech-btn mt-4 hidden" style="background: linear-gradient(135deg,#334155,#475569)">停止摄像头</button>
            </div>
        </div>
    </div>

    <!-- 生成信息管理页 -->
    <div id="page-genmanage" class="hidden p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            <div class="back-btn" data-back="menu"><i class="fa fa-arrow-left"></i> 返回菜单</div>
            <div class="glass-card">
                <h3 class="text-lg font-semibold mb-4 neon-title">生成信息管理</h3>

                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="num" id="gm-total">0</div>
                        <div class="lab">生成总数</div>
                    </div>
                    <div class="stat-box">
                        <div class="num" id="gm-unused" style="color:#34d399">0</div>
                        <div class="lab">未使用</div>
                    </div>
                    <div class="stat-box">
                        <div class="num" id="gm-used" style="color:#f87171">0</div>
                        <div class="lab">已使用</div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3 mb-3">
                    <input id="gm-search" class="tech-input flex-1" style="min-width:180px" placeholder="搜索兑换码 / 奖励内容">
                    <select id="gm-filter" class="tech-input" style="width:140px; flex:none;">
                        <option value="all">全部状态</option>
                        <option value="unused">仅未使用</option>
                        <option value="used">仅已使用</option>
                    </select>
                    <button id="gm-refresh" class="mini-btn">刷新</button>
                </div>

                <div class="flex flex-wrap gap-3 mb-4">
                    <button id="gm-export" class="mini-btn"><i class="fa fa-download"></i> 导出 CSV</button>
                    <button id="gm-del-used" class="mini-btn danger"><i class="fa fa-eraser"></i> 删除已使用</button>
                    <button id="gm-del-all" class="mini-btn danger"><i class="fa fa-trash"></i> 清空全部</button>
                </div>

                <div id="gm-tip"></div>
                <div id="gm-list" class="bg-slate-900/60 rounded-xl max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        // 页面DOM加载完成后再执行所有代码
        document.addEventListener('DOMContentLoaded', function() {
            console.log("页面加载完成，开始初始化");

            // ========== 配置 ==========
            const CONFIG = {
                // 密码
                AUTH_HASH: "6F3C592D6BF1807EEA940D4DF92BFE4180B1A77F4304B59F365839114D9A89EE",
                SUPA_URL: "https://qxnguajnmjltegcihuzj.supabase.co",
                SUPA_KEY: "sb_publishable_kav7LpNfWNPObWnbQfTttw_NioPGsux",
                CODE_POOL: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789",
                CODE_LEN: 12
            };

            // ========== 工具：SHA256加密 ==========
            async function sha256(text) {
                const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
                return Array.from(new Uint8Array(buf))
                    .map(b => b.toString(16).padStart(2, "0"))
                    .join("")
                    .toUpperCase();
            }

            // ========== 页面切换工具 ==========
            const allPages = ["page-login","page-menu","page-redeem","page-generate","page-record","page-clean","page-scan","page-genmanage"];
            function showPage(pageId) {
                allPages.forEach(p => document.getElementById(p).classList.add("hidden"));
                document.getElementById(pageId).classList.remove("hidden");
                
                // 离开扫码页关闭摄像头
                let scanScanner = window._scanScanner;
                if(pageId !== "page-scan" && scanScanner) {
                    scanScanner.stop().catch(()=>{});
                    window._scanScanner = null;
                    document.getElementById("scan-stop-btn").classList.add("hidden");
                }

                // 进入对应页面刷新数据
                if(pageId === "page-record") loadRecordList();
                if(pageId === "page-clean") loadNameList();
                if(pageId === "page-scan") startScan();
                if(pageId === "page-genmanage") loadGenList();
            }

            // ========== 登录逻辑（完全独立，不依赖数据库） ==========
            const pwdInput = document.getElementById("pwd-input");
            const loginBtn = document.getElementById("login-btn");
            const loginTip = document.getElementById("login-tip");
            const logoutBtn = document.getElementById("logout-btn");

            loginBtn.addEventListener("click", async function() {
                const pwd = pwdInput.value.trim();
                if(!pwd) {
                    loginTip.classList.remove("hidden");
                    return;
                }
                try {
                    const hash = await sha256(pwd);
                    if(hash === CONFIG.AUTH_HASH) {
                        loginTip.classList.add("hidden");
                        showPage("page-menu");
                        console.log("登录成功");
                    } else {
                        loginTip.classList.remove("hidden");
                    }
                } catch(e) {
                    alert("加密组件加载失败，请使用HTTPS地址访问本页面");
                    console.error(e);
                }
            });

            // 回车登录
            pwdInput.addEventListener("keydown", function(e) {
                if(e.key === "Enter") loginBtn.click();
            });

            logoutBtn.addEventListener("click", function() {
                showPage("page-login");
                pwdInput.value = "";
                loginTip.classList.add("hidden");
            });

            // ========== 菜单跳转 & 返回 ==========
            document.querySelectorAll("[data-goto]").forEach(function(el) {
                el.addEventListener("click", function() {
                    showPage("page-" + el.dataset.goto);
                });
            });
            document.querySelectorAll("[data-back]").forEach(function(el) {
                el.addEventListener("click", function() {
                    showPage("page-" + el.dataset.back);
                });
            });

            // ========== 初始化数据库 ==========
            let sb = null;
            try {
                if(window.supabase && window.supabase.createClient) {
                    sb = window.supabase.createClient(CONFIG.SUPA_URL, CONFIG.SUPA_KEY);
                    console.log("✅ 数据库初始化成功");
                } else {
                    throw new Error("数据库库未加载");
                }
            } catch(e) {
                console.error("❌ 数据库初始化失败", e);
                // 不阻塞登录，只提示功能异常
            }

            // ========== 生成兑换码 ==========
            function randomCode() {
                let code = "";
                for (let i = 0; i < CONFIG.CODE_LEN; i++) {
                    if (i > 0 && i % 4 === 0) code += "-";
                    code += CONFIG.CODE_POOL[Math.floor(Math.random() * CONFIG.CODE_POOL.length)];
                }
                return code;
            }

            const rewardInput = document.getElementById("reward-input");
            const countInput = document.getElementById("count-input");
            const genBtn = document.getElementById("gen-btn");
            const genTip = document.getElementById("gen-tip");
            const cardList = document.getElementById("card-list");

            genBtn.addEventListener("click", async function() {
                if(!sb) {
                    genTip.innerHTML = '<div class="tip-err">数据库未连接，无法生成</div>';
                    return;
                }
                const reward = rewardInput.value.trim();
                const count = parseInt(countInput.value) || 1;
                if (!reward) {
                    genTip.innerHTML = '<div class="tip-err">请填写奖励内容</div>';
                    return;
                }

                const insertData = [];
                const newCodes = [];
                for (let i = 0; i < count; i++) {
                    const code = randomCode();
                    insertData.push({ code: code, reward: reward, used: false });
                    newCodes.push(code);
                }

                const { error } = await sb.from("codes").insert(insertData);
                if (error) {
                    genTip.innerHTML = `<div class="tip-err">生成失败：${error.message}</div>`;
                    return;
                }

                genTip.innerHTML = `<div class="tip-ok">✅ 成功生成 ${count} 个兑换密钥</div>`;
                rewardInput.value = "";
                cardList.innerHTML = "";

                // 渲染二维码卡片
                newCodes.forEach(function(code) {
                    const card = document.createElement("div");
                    card.className = "code-card";
                    const qrId = "qr-" + code.replace(/-/g, "");
                    card.innerHTML = `
                        <div class="qrcode-wrap" id="${qrId}"></div>
                        <div class="code-text">${code}</div>
                    `;
                    cardList.appendChild(card);
                    new QRCode(document.getElementById(qrId), { text: code, width: 140, height: 140 });
                });
            });

            // ========== 通用兑换逻辑 ==========
            async function doRedeem(codeStr) {
                if(!sb) return { ok: false, msg: "数据库未连接" };
                const code = codeStr.trim().toUpperCase();
                if (!code) return { ok: false, msg: "请输入兑换密钥" };

                const { data, error } = await sb.from("codes").select("*").eq("code", code).single();
                if (error || !data) return { ok: false, msg: "❌ 无效的兑换密钥" };
                if (data.used) return { ok: false, msg: "⚠️ 该密钥已被使用" };

                const now = new Date().toLocaleString();
                await sb.from("codes").update({ used: true, use_time: now }).eq("id", data.id);
                return { ok: true, msg: `🎉 兑换成功！奖励：${data.reward}` };
            }

            // 手动兑换
            const redeemInput = document.getElementById("redeem-input");
            const redeemBtn = document.getElementById("redeem-btn");
            const redeemTip = document.getElementById("redeem-tip");

            redeemBtn.addEventListener("click", async function() {
                const res = await doRedeem(redeemInput.value);
                redeemTip.innerHTML = `<div class="${res.ok ? 'tip-ok' : 'tip-err'}">${res.msg}</div>`;
                if(res.ok) redeemInput.value = "";
            });

            // ========== 兑换记录 ==========
            const recordList = document.getElementById("record-list");
            async function loadRecordList() {
                if(!sb) {
                    recordList.innerHTML = '<div class="p-3 text-red-400">数据库未连接</div>';
                    return;
                }
                const { data, error } = await sb.from("codes").select("*").eq("used", true).order("use_time", { ascending: false });
                recordList.innerHTML = "";
                if(error) {
                    recordList.innerHTML = `<div class="p-3 text-red-400">读取失败：${error.message}</div>`;
                    return;
                }
                if(data.length === 0) {
                    recordList.innerHTML = '<div class="p-3 text-slate-500 text-center">暂无兑换记录</div>';
                    return;
                }
                data.forEach(function(item) {
                    const row = document.createElement("div");
                    row.className = "list-row";
                    row.innerHTML = `
                        <div>
                            <div class="font-mono">${item.code}</div>
                            <div class="text-xs text-slate-400">奖励：${item.reward}</div>
                        </div>
                        <div class="text-xs text-slate-300">${item.use_time || ""}</div>
                    `;
                    recordList.appendChild(row);
                });
            }

            // ========== 免扫地人员 ==========
            const nameInput = document.getElementById("name-input");
            const addNameBtn = document.getElementById("add-name-btn");
            const nameList = document.getElementById("name-list");

            async function loadNameList() {
                if(!sb) {
                    nameList.innerHTML = '<div class="p-3 text-red-400">数据库未连接</div>';
                    return;
                }
                const { data, error } = await sb.from("clean").select("*").order("id", { ascending: false });
                nameList.innerHTML = "";
                if(error) {
                    nameList.innerHTML = `<div class="p-3 text-red-400">读取失败：${error.message}</div>`;
                    return;
                }
                if(data.length === 0) {
                    nameList.innerHTML = '<div class="p-3 text-slate-500 text-center">暂无人员</div>';
                    return;
                }
                data.forEach(function(item) {
                    const row = document.createElement("div");
                    row.className = "list-row";
                    row.innerHTML = `<span>${item.name}</span><span class="del-btn" data-id="${item.id}"><i class="fa fa-trash"></i> 删除</span>`;
                    nameList.appendChild(row);
                });
                document.querySelectorAll(".del-btn").forEach(function(btn) {
                    btn.addEventListener("click", async function() {
                        await sb.from("clean").delete().eq("id", btn.dataset.id);
                        loadNameList();
                    });
                });
            }

            addNameBtn.addEventListener("click", async function() {
                if(!sb) {
                    alert("数据库未连接");
                    return;
                }
                const name = nameInput.value.trim();
                if (!name) return;
                const { error } = await sb.from("clean").insert({ name: name });
                if(error) {
                    alert("添加失败，姓名不能重复");
                    return;
                }
                nameInput.value = "";
                loadNameList();
            });

            // ========== 扫码兑换 ==========
            const scanTip = document.getElementById("scan-tip");
            const scanStopBtn = document.getElementById("scan-stop-btn");

            async function startScan() {
                if(!window.Html5Qrcode) {
                    scanTip.innerHTML = '<div class="tip-err">扫码组件加载失败</div>';
                    return;
                }
                scanTip.innerHTML = "";
                scanStopBtn.classList.remove("hidden");
                
                const scanner = new Html5Qrcode("reader");
                window._scanScanner = scanner;

                scanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    async function(decodedText) {
                        const res = await doRedeem(decodedText);
                        scanTip.innerHTML = `<div class="${res.ok ? 'tip-ok' : 'tip-err'}">${res.msg}</div>`;
                        scanner.stop().then(function() {
                            window._scanScanner = null;
                            scanStopBtn.classList.add("hidden");
                        });
                    },
                    function() {}
                ).catch(function(err) {
                    scanTip.innerHTML = `<div class="tip-err">摄像头启动失败：${err}</div>`;
                });
            }

            scanStopBtn.addEventListener("click", function() {
                if(window._scanScanner) {
                    window._scanScanner.stop().then(function() {
                        window._scanScanner = null;
                        scanStopBtn.classList.add("hidden");
                    });
                }
            });

            // ========== 生成信息管理 ==========
            const gmSearch   = document.getElementById("gm-search");
            const gmFilter   = document.getElementById("gm-filter");
            const gmList     = document.getElementById("gm-list");
            const gmTip      = document.getElementById("gm-tip");
            const gmRefresh  = document.getElementById("gm-refresh");
            const gmExport   = document.getElementById("gm-export");
            const gmDelUsed  = document.getElementById("gm-del-used");
            const gmDelAll   = document.getElementById("gm-del-all");

            let gmAllData = [];
            let gmTipTimer = null;

            function showGmTip(msg, ok) {
                gmTip.innerHTML = `<div class="${ok ? 'tip-ok' : 'tip-err'}">${msg}</div>`;
                clearTimeout(gmTipTimer);
                gmTipTimer = setTimeout(function() { gmTip.innerHTML = ""; }, 3000);
            }

            // 拉取全部兑换码数据
            async function loadGenList() {
                if(!sb) {
                    gmList.innerHTML = '<div class="p-3 text-red-400">数据库未连接</div>';
                    return;
                }
                gmList.innerHTML = '<div class="p-3 text-slate-500 text-center">加载中...</div>';
                const { data, error } = await sb.from("codes").select("*").order("id", { ascending: false });
                if(error) {
                    gmList.innerHTML = `<div class="p-3 text-red-400">读取失败：${error.message}</div>`;
                    return;
                }
                gmAllData = data || [];
                renderGenList();
            }

            // 渲染统计 + 列表
            function renderGenList() {
                const kw = gmSearch.value.trim().toUpperCase();
                const f  = gmFilter.value;

                const total      = gmAllData.length;
                const usedCount  = gmAllData.filter(function(i) { return i.used; }).length;
                document.getElementById("gm-total").textContent  = total;
                document.getElementById("gm-unused").textContent = total - usedCount;
                document.getElementById("gm-used").textContent   = usedCount;

                const list = gmAllData.filter(function(it) {
                    if(f === "used" && !it.used) return false;
                    if(f === "unused" && it.used) return false;
                    if(kw) {
                        const code   = (it.code   || "").toUpperCase();
                        const reward = (it.reward || "").toUpperCase();
                        if(code.indexOf(kw) === -1 && reward.indexOf(kw) === -1) return false;
                    }
                    return true;
                });

                gmList.innerHTML = "";
                if(list.length === 0) {
                    gmList.innerHTML = '<div class="p-3 text-slate-500 text-center">没有匹配的兑换码</div>';
                    return;
                }

                list.forEach(function(item) {
                    const row = document.createElement("div");
                    row.className = "list-row flex-wrap gap-2";
                    row.dataset.id = item.id;
                    row.innerHTML = `
                        <div style="min-width:0; flex:1;">
                            <div class="font-mono text-sm" style="word-break:break-all;">
                                ${item.code}
                                <span class="badge ${item.used ? 'badge-used' : 'badge-ok'}">${item.used ? '已使用' : '未使用'}</span>
                            </div>
                            <div class="text-xs text-slate-400 mt-1">奖励：${item.reward || "—"}</div>
                            <div class="text-xs text-slate-500 mt-1">使用时间：${item.use_time || "—"}</div>
                        </div>
                        <div class="flex gap-2" style="flex:none;">
                            <span class="mini-btn" data-act="copy"><i class="fa fa-copy"></i> 复制</span>
                            <span class="mini-btn" data-act="qr"><i class="fa fa-qrcode"></i> 二维码</span>
                            <span class="mini-btn danger" data-act="del"><i class="fa fa-trash"></i> 删除</span>
                        </div>
                    `;
                    gmList.appendChild(row);
                });
            }

            // 展开 / 收起二维码
            function toggleQr(row, item) {
                const next = row.nextElementSibling;
                if(next && next.classList.contains("qr-row")) {
                    next.remove();
                    return;
                }
                const box = document.createElement("div");
                box.className = "qr-row";
                const holder = document.createElement("div");
                holder.style.display = "inline-block";
                box.appendChild(holder);
                const label = document.createElement("div");
                label.className = "code-text";
                label.textContent = item.code;
                box.appendChild(label);
                row.insertAdjacentElement("afterend", box);
                new QRCode(holder, { text: item.code, width: 140, height: 140 });
            }

            // 复制文本（兼容非 HTTPS 环境）
            function copyText(text) {
                function fallback() {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    ta.style.position = "fixed";
                    ta.style.opacity = "0";
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand("copy");
                        showGmTip("✅ 已复制：" + text, true);
                    } catch(e) {
                        showGmTip("❌ 复制失败，请手动选择", false);
                    }
                    ta.remove();
                }
                if(navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text)
                        .then(function() { showGmTip("✅ 已复制：" + text, true); })
                        .catch(fallback);
                } else {
                    fallback();
                }
            }

            // 列表按钮事件委托
            gmList.addEventListener("click", async function(e) {
                const btn = e.target.closest("[data-act]");
                if(!btn) return;
                const row = btn.closest(".list-row");
                if(!row) return;
                const item = gmAllData.find(function(i) { return String(i.id) === row.dataset.id; });
                if(!item) return;

                const act = btn.dataset.act;

                if(act === "copy") {
                    copyText(item.code);
                    return;
                }
                if(act === "qr") {
                    toggleQr(row, item);
                    return;
                }
                if(act === "del") {
                    if(!confirm("确定删除兑换码 " + item.code + " 吗？")) return;
                    const { error } = await sb.from("codes").delete().eq("id", item.id);
                    if(error) {
                        showGmTip("❌ 删除失败：" + error.message, false);
                        return;
                    }
                    showGmTip("🗑️ 已删除 " + item.code, true);
                    loadGenList();
                }
            });

            // 搜索 / 筛选 / 刷新
            gmSearch.addEventListener("input", renderGenList);
            gmFilter.addEventListener("change", renderGenList);
            gmRefresh.addEventListener("click", loadGenList);

            // 导出 CSV
            gmExport.addEventListener("click", function() {
                if(gmAllData.length === 0) {
                    showGmTip("❌ 暂无数据可导出", false);
                    return;
                }
                const rows = [["兑换码", "奖励内容", "状态", "使用时间"]];
                gmAllData.forEach(function(it) {
                    rows.push([it.code || "", it.reward || "", it.used ? "已使用" : "未使用", it.use_time || ""]);
                });
                const csv = "\uFEFF" + rows.map(function(r) {
                    return r.map(function(c) {
                        return '"' + String(c).replace(/"/g, '""') + '"';
                    }).join(",");
                }).join("\r\n");

                const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "兑换码列表_" + new Date().toLocaleDateString().replace(/\//g, "-") + ".csv";
                a.click();
                URL.revokeObjectURL(a.href);
                showGmTip("✅ 已导出 " + gmAllData.length + " 条记录", true);
            });

            // 删除已使用
            gmDelUsed.addEventListener("click", async function() {
                if(!sb) { showGmTip("❌ 数据库未连接", false); return; }
                const usedCount = gmAllData.filter(function(i) { return i.used; }).length;
                if(usedCount === 0) { showGmTip("⚠️ 没有已使用的兑换码", false); return; }
                if(!confirm("确定删除全部 " + usedCount + " 条【已使用】的兑换码吗？此操作不可恢复！")) return;

                const { error } = await sb.from("codes").delete().eq("used", true);
                if(error) { showGmTip("❌ 删除失败：" + error.message, false); return; }
                showGmTip("🗑️ 已删除 " + usedCount + " 条记录", true);
                loadGenList();
            });

            // 清空全部
            gmDelAll.addEventListener("click", async function() {
                if(!sb) { showGmTip("❌ 数据库未连接", false); return; }
                if(gmAllData.length === 0) { showGmTip("⚠️ 暂无数据", false); return; }
                if(!confirm("确定清空全部 " + gmAllData.length + " 条兑换码吗？此操作不可恢复！")) return;
                if(!confirm("再次确认：真的要清空所有生成记录吗？")) return;

                const { error } = await sb.from("codes").delete().gte("id", 0);
                if(error) { showGmTip("❌ 清空失败：" + error.message, false); return; }
                showGmTip("🧹 已清空全部记录", true);
                loadGenList();
            });

            console.log("✅ 全部初始化完成");
        });
    </script>
</body>
</html>
