<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免扫地卡管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0066ff 0%, #3399ff 100%);
            background-attachment: fixed;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #auth-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: transparent;
            color: white;
            padding: 20px;
        }
        .glass-card{
            background:rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:16px;
        }
        .btn-primary{
            background:#2563eb;
            color:white;
            padding:10px;
            border-radius:8px;
            border:none;
            width:100%;
            cursor:pointer;
        }
        .btn-primary:hover{
            background:#1d4ed8;
        }
        .btn-gray-200{
            background:#e5e7eb;
            color:#111827;
            padding:8px;
            border-radius:6px;
            border:none;
            cursor:pointer;
        }
        .input{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:none;
            outline:none;
        }
        .hidden{
            display:none !important;
        }
        #main-content{
            padding:24px;
            max-width:900px;
            margin:0 auto;
        }
        .tab-btn{
            padding:10px 16px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
        .tab-btn.active{
            background:#2563eb;
            color:white;
        }
        #qrModal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.5);
            z-index:50;
            display:flex;
            align-items:center;
            justify-content:center;
        }
    </style>
</head>
<body>
    <!-- 登录验证弹窗 -->
    <div id="auth-screen">
        <div class="glass-card p-6 w-full max-w-sm text-center">
            <div class="w-14 h-14 rounded-full bg-blue-500 mx-auto flex items-center justify-center text-2xl mb-4">🔒</div>
            <h2 class="text-xl font-bold mb-2">访问验证</h2>
            <p class="text-sm opacity-80 mb-4">请输入密钥进入系统</p>
            <p class="text-xs mb-4 opacity-70">需要兑换请联系管理员，班长或卫生委员廖志强</p>
            <div class="relative">
                <input type="password" id="adminPwd" placeholder="输入密钥" class="input pr-10">
                <button onclick="toggleEye()" class="absolute right-2 top-2">👁</button>
            </div>
            <div id="errTip" class="text-red-200 text-sm mt-3 hidden">密钥错误，请重试！</div>
            <button onclick="checkSecret()" class="btn-primary mt-4">进入系统</button>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="main-content" class="hidden">
        <h2 class="text-xl font-bold text-white mb-6">免扫地卡管理系统</h2>
        <div class="flex gap-1 mb-6">
            <button class="tab-btn active" data-tab="redeem">兑换码</button>
            <button class="tab-btn" data-tab="generate">生成兑换码</button>
            <button class="tab-btn" data-tab="clean">免扫人员管理</button>
        </div>

        <!-- 兑换码面板 -->
        <div id="tab-redeem" class="glass-card p-6 mb-6">
            <h3 class="font-bold mb-4">兑换</h3>
            <input type="text" id="redeemCode" placeholder="输入兑换码" class="input mb-4">
            <button onclick="doRedeem()" class="btn-primary">兑换</button>
            <div id="redeemResult" class="mt-4 text-sm"></div>
        </div>

        <!-- 生成兑换码面板 -->
        <div id="tab-generate" class="glass-card p-6 mb-6 hidden">
            <h3 class="font-bold mb-4">生成兑换码</h3>
            <input type="text" id="genReward" placeholder="填写奖励内容" class="input mb-4">
            <button onclick="createCode()" class="btn-primary">生成兑换码</button>
            <div id="genResult" class="mt-4 text-sm"></div>
        </div>

        <!-- 免扫人员面板 -->
        <div id="tab-clean" class="glass-card p-6 max-w-4xl mx-auto hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">免扫地人员管理表</h2>
            <div class="mb-4">
                <input type="text" id="cleanName" placeholder="输入人员姓名" class="input">
                <button onclick="addCleanPerson()" class="btn-primary">添加免扫地人员</button>
            </div>
            <div id="cleanBody" class="text-sm"></div>
            <div id="cleanEmpty" class="text-center text-gray-800 py-8">暂无人员安排</div>
        </div>
    </div>

    <!-- 二维码弹窗 -->
    <div id="qrModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl p-5 w-full max-w-sm text-center">
            <div id="modalQr"></div>
            <p id="modalCode" class="font-mono text-blue-600 my-3"></p>
            <div class="flex gap-2">
                <button onclick="copyNow()" class="flex-1 bg-blue-500 text-white py-2 rounded">复制</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-200 py-2 rounded">关闭</button>
            </div>
        </div>
    </div>

<script>
// ================= Supabase配置 =================
const SUPABASE_URL = "https://qxgujwamj1jtegcjuz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kav7LpNfWN0bQnfWbQ0GjwQwPwM0iPGsux";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 密码哈希（不要修改）
const ADMIN_PASSWORD_HASH = "33b6524013435235366F7720120416392405107921366012001371352140174";

let nowCode = "";
let codeMap = {};

// SHA256哈希计算
async function sha256(text){
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
}

// 登录验证【重点修复】
async function checkSecret(){
  console.log("开始校验密码");
  let v = document.getElementById('adminPwd').value.trim();
  const inputHash = await sha256(v);
  console.log("输入哈希：",inputHash);
  console.log("预设哈希：",ADMIN_PASSWORD_HASH);

  if(inputHash === ADMIN_PASSWORD_HASH){
    console.log("密码正确，进入系统");
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    await loadAllCodes();
    await renderCleanList();
    tabSwitch();
  }else{
    console.log("密码错误");
    document.getElementById('errTip').classList.remove('hidden');
  }
}

// 密码框显示/隐藏
function toggleEye(){
  const input = document.getElementById("adminPwd");
  if(input.type === "password"){
    input.type = "text";
  }else{
    input.type = "password";
  }
}

// 读取兑换码
async function loadAllCodes() {
  const { data, error } = await supabase.from("codes").select("*");
  if (error) {
    alert("读取兑换码失败：" + error.message);
    return {};
  }
  codeMap = {};
  data.forEach(item => {
    codeMap[item.code] = {
      reward: item.reward,
      used: item.used,
      time: item.use_time,
    }
  });
  return codeMap;
}

// 标签切换
function tabSwitch(){
  const tabs = document.querySelectorAll(".tab-btn");
  tabs.forEach(btn=>{
    btn.onclick = function(){
      tabs.forEach(b=>b.classList.remove("active"));
      this.classList.add("active");
      const target = this.dataset.tab;
      document.getElementById("tab-redeem").classList.add("hidden");
      document.getElementById("tab-generate").classList.add("hidden");
      document.getElementById("tab-clean").classList.add("hidden");
      document.getElementById("tab-"+target).classList.remove("hidden");
    }
  })
}

// 生成兑换码
async function createCode(){
  const reward = document.getElementById("genReward").value.trim();
  if(!reward){alert("请填写奖励内容");return;}
  const code = Math.random().toString(36).slice(2,10);
  const {error} = await supabase.from("codes").insert([{code, reward, used:false}]);
  if(error){alert("生成失败："+error.message);return;}
  nowCode = code;
  showQr(code);
  document.getElementById("genResult").innerText = "生成成功："+code;
  await loadAllCodes();
}

// 兑换码兑换
async function doRedeem(){
  const c = document.getElementById("redeemCode").value.trim();
  if(!c) return;
  const item = codeMap[c];
  if(!item){
    document.getElementById("redeemResult").innerText="兑换码不存在";
    return;
  }
  if(item.used){
    document.getElementById("redeemResult").innerText="兑换码已被使用";
    return;
  }
  const {error} = await supabase.from("codes").update({used:true, use_time:new Date().toLocaleString()}).eq("code",c);
  if(error){alert("兑换失败："+error.message);return;}
  document.getElementById("redeemResult").innerText="兑换成功！奖励："+item.reward;
  await loadAllCodes();
}

// 二维码弹窗
function showQr(code){
  document.getElementById("modalQr").innerHTML="";
  new QRCode(document.getElementById("modalQr"),code);
  document.getElementById("modalCode").innerText=code;
  document.getElementById("qrModal").classList.remove("hidden");
}
function closeModal(){
  document.getElementById("qrModal").classList.add("hidden");
}
function copyNow(){
  navigator.clipboard.writeText(nowCode);
  alert("已复制兑换码");
}

// 免扫人员管理
async function addCleanPerson(){
  const name = document.getElementById("cleanName").value.trim();
  if(!name){alert("请输入姓名");return;}
  const {error}=await supabase.from("clean").insert([{name}]);
  if(error){alert("添加失败："+error.message);return;}
  document.getElementById("cleanName").value="";
  await renderCleanList();
}
async function renderCleanList(){
  const {data,error}=await supabase.from("clean").select("*");
  if(error){alert("读取人员失败："+error.message);return;}
  const body = document.getElementById("cleanBody");
  const empty = document.getElementById("cleanEmpty");
  if(data.length===0){
    body.innerHTML="";
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");
  let html="";
  data.forEach(row=>{
    html += `<div class="flex justify-between items-center my-2">
      <span>${row.name}</span>
      <button onclick="deleteCleanPerson('${row.id}')" class="btn-gray-200">删除</button>
    </div>`;
  })
  body.innerHTML=html;
}
async function deleteCleanPerson(id){
  const {error}=await supabase.from("clean").delete().eq("id",id);
  if(error){alert("删除失败："+error.message);return;}
  await renderCleanList();
}
</script>
</body>
</html>
