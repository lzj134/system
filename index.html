<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免扫地卡管理系统</title>
    <!-- 样式CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 替换为unpkg的supabase，稳定性更好 -->
    <script src="https://unpkg.com/@supabase/supabase-js@2.49.8"></script>
    <!-- qrcodejs -->
    <script src="https://cdn.jsdelivr.net/npm/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        /* 这里保留你原来所有自定义css样式，不要删 */
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, sans-serif;
        }
        .menu-btn{
            background:#1e293b;
            border:1px solid #334155;
            padding:24px 12px;
            border-radius:10px;
            cursor:pointer;
            transition:0.2s;
        }
        .menu-btn:hover{
            background:#334155;
        }
        .page{
            display:none;
        }
        .page.active{
            display:block;
        }
    </style>
</head>
<body>
    <!-- 页面HTML结构，保留你原来全部DOM，不要改动 -->
    <div id="loginPage" class="page active">
        <div class="max-w-md mx-auto mt-32 p-6">
            <h2 class="text-2xl text-center mb-6">免扫地卡管理系统</h2>
            <input type="password" id="pwdInput" class="w-full p-3 rounded bg-slate-800 border border-slate-600 mb-4" placeholder="请输入密码">
            <button id="loginBtn" class="w-full bg-blue-600 p-3 rounded">登录</button>
        </div>
    </div>

    <div id="mainPage" class="page">
        <div class="max-w-4xl mx-auto p-4">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold">免扫地卡管理系统</h1>
                <button id="logoutBtn" class="bg-red-600 px-4 py-2 rounded text-white">退出登录</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="menu-btn text-center" data-page="exchangePage">
                    <div class="text-2xl mb-1">🎁</div>
                    <div>兑换码兑换</div>
                </div>
                <div class="menu-btn text-center" data-page="genPage">
                    <div class="text-2xl mb-1">🔑</div>
                    <div>生成兑换码</div>
                </div>
                <div class="menu-btn text-center" data-page="recordPage">
                    <div class="text-2xl mb-1">🔄</div>
                    <div>兑换记录</div>
                </div>
                <div class="menu-btn text-center" data-page="userPage">
                    <div class="text-2xl mb-1">🐾</div>
                    <div>免扫地人员表</div>
                </div>
                <div class="menu-btn text-center" data-page="scanPage">
                    <div class="text-2xl mb-1">📱</div>
                    <div>扫码兑换</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 下面是各个子页面DOM，你原来的全部保留，不要删 -->
    <div id="exchangePage" class="page max-w-4xl mx-auto p-4">
        <h2 class="text-xl mb-4">兑换码兑换</h2>
        <input id="codeInput" class="w-full p-3 bg-slate-800 border border-slate-600 rounded mb-3" placeholder="输入兑换码">
        <button id="doExchangeBtn" class="bg-blue-600 px-4 py-2 rounded text-white">执行兑换</button>
    </div>

    <div id="genPage" class="page max-w-4xl mx-auto p-4">
        <h2 class="text-xl mb-4">生成兑换码</h2>
        <input type="number" id="genCount" class="w-full p-3 bg-slate-800 border border-slate-600 rounded mb-3" placeholder="生成数量" value="1">
        <button id="genBtn" class="bg-green-600 px-4 py-2 rounded text-white mb-4">生成兑换码</button>
        <div id="genResult"></div>
    </div>

    <div id="recordPage" class="page max-w-4xl mx-auto p-4">
        <h2 class="text-xl mb-4">兑换记录</h2>
        <div id="recordList"></div>
    </div>

    <div id="userPage" class="page max-w-4xl mx-auto p-4">
        <h2 class="text-xl mb-4">免扫地人员表</h2>
        <div id="userList"></div>
    </div>

    <div id="scanPage" class="page max-w-4xl mx-auto p-4">
        <h2 class="text-xl mb-4">扫码兑换</h2>
        <div id="qrcodeBox"></div>
    </div>


    <script>
        // 全部业务代码包裹在DOMContentLoaded，确保页面DOM全部加载完再运行
        document.addEventListener('DOMContentLoaded', () => {
            const CONFIG = {
                AUTH_HASH: "6F3C592D6BF1807EEA940D4DF92BFE4180B1A77F4304B59F365839114D9A89EE",
                SUPA_URL: "https://qxnguajnmjltegcihuzj.supabase.co",
                SUPA_KEY: "sb_publishable_kav7LpNfWNPObWnbQfTtw_NioPGsux",
                CODE_POOL: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789",
                CODE_LEN: 12
            };

            let sb;
            console.log("window.supabase:", window.supabase);
            if(window.supabase && window.supabase.createClient){
                sb = window.supabase.createClient(CONFIG.SUPA_URL, CONFIG.SUPA_KEY);
                console.log("✅supabase初始化成功");
            }else{
                alert("❌数据库模块加载失败！请按Ctrl+F5强制刷新页面");
                console.error("❌supabase没有加载成功！");
                return;
            }

            // ==========下面粘贴你原来全部JS逻辑代码（登录、页面切换、生成码、兑换、查询、扫码）==========
            // 【你的原有全部代码从这里开始】
            // 页面切换函数
            function showPage(pageId){
                document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
            }

            // 登录逻辑
            document.getElementById('loginBtn').addEventListener('click', async ()=>{
                const pwd = document.getElementById('pwdInput').value;
                // 简单密码校验，你原来的逻辑
                const hash = await crypto.subtle.digest('SHA‑256', new TextEncoder().encode(pwd));
                const hex = Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
                if(hex === CONFIG.AUTH_HASH){
                    showPage('mainPage');
                }else{
                    alert("密码错误");
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', ()=>{
                showPage('loginPage');
            });

            // 菜单按钮点击
            document.querySelectorAll('.menu-btn').forEach(btn=>{
                btn.addEventListener('click', ()=>{
                    const pid = btn.dataset.page;
                    showPage(pid);
                })
            });

            // 这里继续把你剩下所有代码：生成兑换码、兑换逻辑、读取记录、人员表、二维码扫码全部粘贴进来
            // 【你的原有全部代码到此结束】

        });
    </script>
</body>
</html>
