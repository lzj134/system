<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免扫地云管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#12121a;color:#fff;padding:20px}
.container{max-width:900px;margin:0 auto}
.card{background:#1e1e2f;padding:24px;border-radius:14px;margin-bottom:16px}
input,button{padding:10px 12px;border-radius:8px;border:none;font-size:16px;margin:6px 0}
input{width:100%;background:#2c2c44;color:#fff;border:1px solid #444}
button{background:#6366f1;color:#fff;cursor:pointer;font-weight:bold}
button:hover{background:#4f46e5}
.row{display:flex;gap:10px;align-items:center}
.log-item{padding:12px;border-bottom:1px solid #333}
.type-create{color:#4ade80}
.type-exchange{color:#60a5fa}
.pwd-wrap{position:relative}
#eyeBtn{position:absolute;right:10px;top:14px;background:transparent;border:none;width:30px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<div id="loginPage" class="card">
<h2>系统登录</h2>
<div class="pwd-wrap">
<input id="pwdInput" type="password" placeholder="输入管理员密码">
<button id="eyeBtn" onclick="togglePwd()">👁</button>
</div>
<button onclick="login()">登录系统</button>
<div id="loginTip"></div>
</div>

<div id="mainPage" class="hidden">
<div class="card">
<button onclick="goHome()">返回菜单</button>
<h2>创建新兑换密钥</h2>
<input id="rewardInput" placeholder="奖励内容 (如: 免扫地一次)">
<div class="row">
<input id="countInput" value="1" style="width:80px">
<button onclick="genCode()">一键生成</button>
</div>
<div id="genTip"></div>
<div id="qrcard" class="hidden">
<canvas id="qrcanvas"></canvas>
<p id="codeText"></p>
</div>
</div>

<div class="card">
<h3>功能菜单</h3>
<button onclick="showPage('gen')">生成兑换码</button>
<button onclick="showPage('exchange')">手动兑换</button>
<button onclick="showPage('log')">兑换记录/生成日志</button>
<button onclick="showPage('userlist')">免扫地人员管理</button>
</div>

<!-- 手动兑换 -->
<div id="pageExchange" class="card hidden">
<h2>手动兑换</h2>
<input id="exchangeCode" placeholder="粘贴兑换码">
<button onclick="doExchange()">兑换</button>
<div id="exTip"></div>
</div>

<!-- 兑换记录 -->
<div id="pageLog" class="card hidden">
<h2>兑换&生成全部记录</h2>
<button onclick="loadLog()">刷新记录</button>
<div id="logBox"></div>
</div>

<!-- 人员管理 -->
<div id="pageUser" class="card hidden">
<h2>免扫地人员管理</h2>
<input id="newUser" placeholder="输入姓名">
<button onclick="addUser()">添加</button>
<div id="userBox"></div>
</div>
</div>
</div>

<script>
// ========== 这里替换成你的 Supabase 信息 ==========
const SUPABASE_URL = "https://qxnguajnmjltegcihuzj.supabase.co";
const SUPABASE_KEY = "sb_publishable_kav7LpNfWNPObWnbQfTttw_NioPGsux";
// ================================================
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ADMIN_PWD_HASH = "6F3C592D6BF1807EEA940D4DF92BFE4180B1A77F4304B59F365839114D9A89EE";

// 密码显隐切换
function togglePwd(){
  const inp = document.getElementById("pwdInput");
  inp.type = inp.type==="password"?"text":"password";
}

// 登录校验
async function login(){
  const raw = document.getElementById("pwdInput").value;
  const hashObj = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
  const hex = Array.from(new Uint8Array(hashObj)).map(b=>b.toString(16).padStart(2,"0")).join("");
  if(hex === ADMIN_PWD_HASH){
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("mainPage").classList.remove("hidden");
    showPage("gen");
  }else{
    document.getElementById("loginTip").innerText="密钥错误";
  }
}

// 页面切换
function showPage(type){
  const pages = ["pageExchange","pageLog","pageUser"];
  pages.forEach(p=>document.getElementById(p).classList.add("hidden"))
  if(type==="exchange") document.getElementById("pageExchange").classList.remove("hidden");
  if(type==="log") {
    document.getElementById("pageLog").classList.remove("hidden");
    loadLog();
  }
  if(type==="userlist"){
    document.getElementById("pageUser").classList.remove("hidden");
    loadUser();
  }
}
function goHome(){showPage("gen")}

// 生成兑换码 
async function genCode(){
  const reward = document.getElementById("rewardInput").value;
  const count = parseInt(document.getElementById("countInput").value);
  document.getElementById("genTip").innerText="";
  if(!reward) return document.getElementById("genTip").innerText="请填写内容";
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWX0123456789";
  let codeList = [];
  for(let i=0;i<count;i++){
    let c = "";
    for(let j=0;j<8;j++) c+=chars[Math.floor(Math.random()*chars.length)];
    codeList.push({code:c,reward:reward,used:false})
  }
  // 插入codes表
  const {error} = await supabase.from("codes").insert(codeList);
  if(error) return document.getElementById("genTip").innerText="生成失败:"+error.message;
  // 写入操作日志（生成记录）
  for(let item of codeList){
    await supabase.from("operation_log").insert([{
      action_type:"create",
      code_text:item.code,
      reward_text:item.reward,
      operator:"管理员"
    }])
  }
  document.getElementById("genTip").innerText=`✅成功生成${count}个兑换密钥`;
  // 渲染第一个二维码
  const firstCode = codeList[0].code;
  document.getElementById("qrcard").classList.remove("hidden");
  QRCode.toCanvas(document.getElementById("qrcanvas"),firstCode,{width:180});
  document.getElementById("codeText").innerText=firstCode;
}

// 兑换函数 + 写入兑换日志
async function doExchange(){
  const c = document.getElementById("exchangeCode").value.trim();
  const {data,err} = await supabase.from("codes").select("*").eq("code",c).eq("used",false).single();
  if(err || !data) return document.getElementById("exTip").innerText="兑换码无效或已使用";
  // 标记已使用
  await supabase.from("codes").update({used:true}).eq("code",c);
  // 写入兑换日志
  await supabase.from("operation_log").insert([{
    action_type:"exchange",
    code_text:c,
    reward_text:data.reward,
    operator:"用户"
  }])
  document.getElementById("exTip").innerText="✅兑换成功！奖励："+data.reward;
}

// 加载全部日志：生成记录 + 兑换记录
async function loadLog(){
  const {data,error} = await supabase
  .from("operation_log")
  .select("*")
  .order("create_at",{ascending:false})
  const box = document.getElementById("logBox");
  box.innerHTML="";
  if(error){box.innerText="读取日志失败"+error.message;return;}
  data.forEach(row=>{
    const typeTxt = row.action_type==="create"?"✅【生成兑换码】":"🎫【完成兑换】";
    const cls = row.action_type==="create"?"type-create":"type-exchange";
    box.innerHTML += `
    <div class="log-item ${cls}">
      <div>${new Date(row.create_at).toLocaleString()}</div>
      <div>${typeTxt}</div>
      <div>兑换码：${row.code_text}</div>
      <div>奖励：${row.reward_text}</div>
      <div>操作人：${row.operator}</div>
    </div>`
  })
}

// 人员列表
async function loadUser(){
  const {data} = await supabase.from("clean").select("*");
  const box = document.getElementById("userBox");
  box.innerHTML="";
  data.forEach(u=>{
    box.innerHTML += `<div>${u.name} <button onclick="delUser(${u.id})">删除</button></div>`
  })
}
async function addUser(){
  const name = document.getElementById("newUser").value.trim();
  await supabase.from("clean").insert([{name}]);
  loadUser();
}
async function delUser(id){
  await supabase.from("clean").delete().eq("id",id);
  loadUser();
}
</script>
</body>
</html>
