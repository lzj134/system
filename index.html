<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兑换码系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass{
            background:rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
            border-radius:16px;
            padding:24px;
        }
        .input{
            width:100%;
            padding:12px 14px;
            border:1px solid #cbd5e1;
            border-radius:10px;
            margin-bottom:12px;
            font-size:16px;
        }
        .btn-primary{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }
        .hide{display:none;}
        [data-tab-panel]{display:none;}
        [data-tab-panel].active{display:block;}
        .tab-btn.active{background:#2563eb;color:white;}
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4">
    <div id="loginBox" class="max-w-md mx-auto glass">
        <h2 class="text-xl font-bold text-center mb-6">管理员登录</h2>
        <input type="password" id="loginPwd" class="input" placeholder="输入管理员密码">
        <button id="loginBtn" class="btn-primary">登录</button>
    </div>

    <div id="mainBox" class="hidden">
        <div class="max-w-md mx-auto mb-4 flex gap-2">
            <button class="tab-btn flex-1 py-2 rounded-lg border" data-tab="redeem">兑换</button>
            <button class="tab-btn flex-1 py-2 rounded-lg border" data-tab="generate">生成兑换码</button>
            <button class="tab-btn flex-1 py-2 rounded-lg border" data-tab="clean">免扫地人员</button>
        </div>

        <!-- Tab面板：兑换 -->
        <div data-tab-panel="redeem" class="glass max-w-md mx-auto active">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-blue-600 to-sky-400"></div>
                <h2 class="mt-3 text-xl font-bold text-gray-800">输入兑换码</h2>
            </div>
            <input id="inputRedeemCode" maxlength="14" placeholder="XXXX-XXXX-XXXX" class="input">
            <button id="btnDoRedeem" class="btn-primary">立即兑换</button>
            <div id="redeemResultTip" class="mt-4 text-center rounded-lg py-2 hide"></div>
        </div>

        <!-- Tab面板：生成兑换码 -->
        <div data-tab-panel="generate" class="glass max-w-md mx-auto">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-emerald-600 to-green-400"></div>
                <h2 class="mt-3 text-xl font-bold text-gray-800">生成新兑换码</h2>
            </div>
            <div class="flex gap-2 mb-4">
                <input id="inputReward" placeholder="奖励内容" class="input flex-1">
                <button id="btnGenCode" class="btn-primary">生成兑换码</button>
            </div>
            <div id="genResultTip" class="mt-2 text-center rounded-lg py-2 hide"></div>
            <div class="mt-4">
                <h3 class="font-bold mb-2">已生成兑换码列表</h3>
                <div id="codeListBox" class="bg-white/80 rounded-lg p-3 max-h-60 overflow-y-auto"></div>
            </div>
        </div>

        <!-- Tab面板：免扫地人员管理 -->
        <div data-tab-panel="clean" class="glass max-w-md mx-auto">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-amber-600 to-yellow-400"></div>
                <h2 class="mt-3 text-xl font-bold text-gray-800">免扫地人员名单</h2>
            </div>
            <div class="flex gap-2 mb-4">
                <input id="inputCleanName" placeholder="输入姓名" class="input flex-1">
                <button id="btnAddClean" class="btn-primary">添加</button>
            </div>
            <div id="cleanListBox" class="bg-white/80 rounded-lg p-3 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

<script>
const CONFIG = {
  AUTH_PASSWORD_HASH: "33b6524013435235366F7720120416392405107921366012001371352140174",
  SUPABASE_URL: "https://qxnguajnmjltegcihuzj.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_kav7LpNfWNP0bWnbQfTtw_NioPGsux",
  CODE_CHAR_POOL: "ABCDEFGHIJKLMNOPQRSTUVWXYZ23456789",
  CODE_RAW_LEN:12
};

// 初始化Supabase客户端，只出现这一次！
const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

// SHA256密码校验
async function sha256(text){
    const buf = await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
}

// 登录逻辑
document.getElementById("loginBtn").addEventListener("click",async ()=>{
    const pwd = document.getElementById("loginPwd").value;
    const hash = await sha256(pwd);
    if(hash === CONFIG.AUTH_PASSWORD_HASH){
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("mainBox").classList.remove("hidden");
        loadCodeList();
        loadCleanList();
    }else{
        alert("密码错误");
    }
});

// tab切换
document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
        const tabName = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        document.querySelectorAll("[data-tab-panel]").forEach(p=>p.classList.remove("active"));
        btn.classList.add("active");
        document.querySelector(`[data-tab-panel="${tabName}"]`).classList.add("active");
    })
})

// ========== 兑换码业务 ==========
async function loadCodeList() {
    const { data, error } = await supabase.from('codes').select('*').order('id', { ascending: false });
    if(error) return console.error(error);
    const box = document.getElementById('codeListBox');
    box.innerHTML = '';
    data.forEach(item=>{
        const div = document.createElement('div');
        div.className = "flex justify-between items-center border-b py-1";
        div.innerHTML = `
            <span>${item.code}</span>
            <span class="${item.used?'text-red-500':'text-green-500'}">${item.used?'已使用':'未使用'}</span>
        `;
        box.appendChild(div);
    })
}

// 生成兑换码
document.getElementById('btnGenCode').addEventListener('click',async ()=>{
    const reward = document.getElementById('inputReward').value.trim();
    const tipDom = document.getElementById('genResultTip');
    if(!reward){
        tipDom.textContent = "请填写奖励内容";
        tipDom.className="mt-2 text-center rounded-lg py-2 text-red-500";
        return;
    }
    const pool = CONFIG.CODE_CHAR_POOL;
    let code = '';
    for(let i=0;i<CONFIG.CODE_RAW_LEN;i++){
        code += pool[Math.floor(Math.random()*pool.length)]
    }
    const {error} = await supabase.from('codes').insert({code,reward});
    if(error){
        tipDom.textContent="生成失败:"+error.message;
        tipDom.className="mt-2 text-center rounded-lg py-2 text-red-500";
        return;
    }
    tipDom.textContent="生成成功："+code;
    tipDom.className="mt-2 text-center rounded-lg py-2 text-green-600";
    document.getElementById('inputReward').value="";
    loadCodeList();
})

//兑换操作
document.getElementById('btnDoRedeem').addEventListener('click',async ()=>{
    const code = document.getElementById('inputRedeemCode').value.trim();
    const tipDom = document.getElementById('redeemResultTip');
    if(!code){
        tipDom.textContent="请输入兑换码";
        tipDom.className="mt-4 text-center rounded-lg py-2 text-red-500";
        return;
    }
    const {data,error} = await supabase.from('codes').select('*').eq('code',code).single();
    if(error || !data){
        tipDom.textContent="兑换码不存在";
        tipDom.className="mt-4 text-center rounded-lg py-2 text-red-500";
        return;
    }
    if(data.used){
        tipDom.textContent="该兑换码已经被使用过";
        tipDom.className="mt-4 text-center rounded-lg py-2 text-red-500";
        return;
    }
    const now = new Date().toLocaleString();
    await supabase.from('codes').update({used:true,use_time:now}).eq('id',data.id);
    tipDom.textContent=`兑换成功！奖励：${data.reward}`;
    tipDom.className="mt-4 text-center rounded-lg py-2 text-green-600";
    document.getElementById('inputRedeemCode').value="";
    loadCodeList();
})

// ==========免扫地人员业务==========
async function loadCleanList(){
    const {data,error} = await supabase.from('clean').select('*').order('id',{ascending:false});
    if(error) return console.error(error);
    const box = document.getElementById('cleanListBox');
    box.innerHTML = '';
    data.forEach(item=>{
        const div = document.createElement('div');
        div.className="flex justify-between items-center border-b py-1";
        div.innerHTML = `<span>${item.name}</span>
        <button class="text-red-500 text-sm delCleanBtn" data-id="${item.id}">删除</button>`;
        box.appendChild(div);
    })
    document.querySelectorAll('.delCleanBtn').forEach(btn=>{
        btn.onclick = async function(){
            const id = this.dataset.id;
            await supabase.from('clean').delete().eq('id',id);
            loadCleanList();
        }
    })
}

document.getElementById('btnAddClean').addEventListener('click',async ()=>{
    const name = document.getElementById('inputCleanName').value.trim();
    if(!name) return;
    const {error} = await supabase.from('clean').insert({name});
    if(error){
        alert("添加失败，姓名不能重复");
        return;
    }
    document.getElementById('inputCleanName').value="";
    loadCleanList();
})

</script>
</body>
</html>
