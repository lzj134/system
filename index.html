<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端卫生管理系统</title>
    <!-- 外部依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,monospace}
        body{
            background:#050816;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(18, 110, 255,0.12) 0%,transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237,0.1) 0%,transparent 40%);
            min-height:100vh;
            color:#e2e8f0;
            overflow-x:hidden;
        }
        /* 粒子背景 */
        #particle-bg{
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            z-index:-1;
            opacity:0.35;
        }
        .glass-card{
            background:rgba(15,23,42,0.65);
            backdrop-filter: blur(12px);
            border:1px solid rgba(99, 102, 241,0.25);
            box-shadow:0 0 24px rgba(79,70,229,0.2);
            border-radius:18px;
            padding:28px;
            transition:all 0.3s ease;
        }
        .glass-card:hover{
            border-color:rgba(99, 102, 241,0.45);
            box-shadow:0 0 32px rgba(79,70,229,0.35);
        }
        .neon-text{
            text-shadow:0 0 8px #6366f1,0 0 16px #818cf8;
        }
        .input-tech{
            width:100%;
            padding:14px 16px;
            background:rgba(30,41,59,0.7);
            border:1px solid rgba(99,102,241,0.3);
            border-radius:12px;
            color:#f1f5f9;
            font-size:15px;
            transition:0.25s;
            outline:none;
        }
        .input-tech:focus{
            border-color:#818cf8;
            box-shadow:0 0 0 3px rgba(129,140,248,0.2);
        }
        .btn-tech{
            width:100%;
            padding:14px;
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            color:#fff;
            border:none;
            border-radius:12px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            box-shadow:0 4px 12px rgba(79,70,229,0.3);
        }
        .btn-tech:hover{
            transform:translateY(-2px);
            box-shadow:0 6px 18px rgba(79,70,229,0.45);
        }
        .btn-tech:active{transform:translateY(0)}
        .tab-item{
            padding:12px 16px;
            border-radius:10px;
            background:rgba(30,41,59,0.5);
            border:1px solid rgba(99,102,241,0.2);
            cursor:pointer;
            transition:0.25s;
        }
        .tab-item.active{
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            color:white;
            border-color:#818cf8;
        }
        .panel{display:none;}
        .panel.active{display:block;}
        .list-item{
            padding:10px 12px;
            border-bottom:1px solid rgba(99,102,241,0.15);
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .status-green{color:#34d399;text-shadow:0 0 4px #34d399}
        .status-red{color:#f87171;text-shadow:0 0 4px #f87171}
        .tip-success{color:#34d399;text-align:center;padding:10px}
        .tip-error{color:#f87171;text-align:center;padding:10px}
        .del-btn{
            color:#f87171;
            cursor:pointer;
            padding:4px 8px;
            border-radius:6px;
            transition:0.2s;
        }
        .del-btn:hover{background:rgba(248,113,113,0.15)}
        .hidden{display:none !important;}
    </style>
</head>
<body>
    <canvas id="particle-bg"></canvas>

    <div class="max-w-xl mx-auto px-4 py-10">
        <!-- 登录页面 -->
        <div id="login-page" class="glass-card">
            <h2 class="text-2xl font-bold text-center neon-text mb-8">🔐 云端管理系统登录</h2>
            <input type="password" id="login-password" class="input-tech mb-5" placeholder="请输入管理员密钥">
            <button id="login-btn" class="btn-tech"><i class="fa fa-sign-in"></i> 身份验证</button>
        </div>

        <!-- 主业务界面 -->
        <div id="main-page" class="hidden">
            <div class="flex gap-3 mb-6">
                <div class="tab-item flex-1 text-center" data-tab="redeem"><i class="fa fa-gift"></i> 兑换校验</div>
                <div class="tab-item flex-1 text-center" data-tab="generate"><i class="fa fa-key"></i> 生成密钥</div>
                <div class="tab-item flex-1 text-center" data-tab="clean"><i class="fa fa-users"></i> 免扫地名单</div>
            </div>

            <!-- 兑换面板 -->
            <div class="panel active" data-panel="redeem">
                <div class="glass-card">
                    <h3 class="text-xl font-bold neon-text mb-5"><i class="fa fa-exchange"></i> 兑换码核验</h3>
                    <input id="redeem-input" class="input-tech mb-4" placeholder="输入兑换密钥">
                    <button id="redeem-submit" class="btn-tech"><i class="fa fa-check-circle"></i> 执行兑换</button>
                    <div id="redeem-tip" class="mt-4"></div>
                </div>
            </div>

            <!-- 生成兑换码面板 -->
            <div class="panel" data-panel="generate">
                <div class="glass-card">
                    <h3 class="text-xl font-bold neon-text mb-5"><i class="fa fa-random"></i> 创建新兑换密钥</h3>
                    <div class="flex gap-3 mb-4">
                        <input id="reward-input" class="input-tech flex-1" placeholder="奖励内容">
                        <button id="gen-btn" class="btn-tech w-auto px-6"><i class="fa fa-plus"></i> 生成</button>
                    </div>
                    <div id="gen-tip" class="mb-4"></div>
                    <h4 class="font-semibold mb-3">密钥列表</h4>
                    <div id="code-list" class="bg-slate-900/50 rounded-xl max-h-64 overflow-y-auto p-2"></div>
                </div>
            </div>

            <!-- 免扫地人员面板 -->
            <div class="panel" data-panel="clean">
                <div class="glass-card">
                    <h3 class="text-xl font-bold neon-text mb-5"><i class="fa fa-user-circle"></i> 免扫地人员管理</h3>
                    <div class="flex gap-3 mb-4">
                        <input id="clean-name-input" class="input-tech flex-1" placeholder="输入人员姓名">
                        <button id="clean-add-btn" class="btn-tech w-auto px-6"><i class="fa fa-plus"></i> 添加</button>
                    </div>
                    <div id="clean-list" class="bg-slate-900/50 rounded-xl max-h-64 overflow-y-auto p-2"></div>
                </div>
            </div>
        </div>
    </div>

<script>
// ========== 配置（对接Supabase云端，不要修改） ==========
const CONFIG = {
    AUTH_PASSWORD_HASH: "6F3C592D6BF1807EEA940D4DF92BFE4180B1A77F4304B59F365839114D9A89EE",
    SUPABASE_URL: "https://qxnguajnmjltegcihuzj.supabase.co",
    SUPABASE_ANON_KEY: "sb_publishable_kav7LpNfWNP0bWnbQfTtw_NioPGsux",
    CODE_CHAR_POOL: "ABCDEFGHIJKLMNOPQRSTUVWXYZ23456789",
    CODE_RAW_LEN:12
};

// 初始化supabase客户端【只声明一次】
const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

// 粒子背景动画（科技效果）
(function particleEffect(){
    const canvas = document.getElementById("particle-bg");
    const ctx = canvas.getContext("2d");
    let w,h,particles=[];
    function resize(){
        w=canvas.width=window.innerWidth;
        h=canvas.height=window.innerHeight;
    }
    resize();
    window.addEventListener("resize",resize);
    class Particle{
        constructor(){
            this.x=Math.random()*w;
            this.y=Math.random()*h;
            this.vx=(Math.random()-0.5)*0.3;
            this.vy=(Math.random()-0.5)*0.3;
            this.r=Math.random()*1.2+0.3;
        }
        update(){
            this.x+=this.vx;
            this.y+=this.vy;
            if(this.x<0||this.x>w)this.vx*=-1;
            if(this.y<0||this.y>h)this.vy*=-1;
        }
        draw(){
            ctx.beginPath();
            ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
            ctx.fillStyle="rgba(129,140,248,0.4)";
            ctx.fill();
        }
    }
    for(let i=0;i<120;i++) particles.push(new Particle());
    function loop(){
        ctx.clearRect(0,0,w,h);
        particles.forEach(p=>{p.update();p.draw()});
        requestAnimationFrame(loop);
    }
    loop();
})();

// SHA256密码校验
async function sha256Encode(text){
    const buf = await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
}

// 登录逻辑
document.getElementById("login-btn").addEventListener("click",async ()=>{
    const pwd = document.getElementById("login-password").value.trim();
    const hash = await sha256Encode(pwd);
    if(hash === CONFIG.AUTH_PASSWORD_HASH){
        document.getElementById("login-page").classList.add("hidden");
        document.getElementById("main-page").classList.remove("hidden");
        loadCodeList();
        loadCleanList();
    }else{
        alert("🔒 密钥验证失败，请重新输入");
    }
});

// Tab切换
document.querySelectorAll(".tab-item").forEach(tab=>{
    tab.addEventListener("click",()=>{
        const name = tab.dataset.tab;
        document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
        tab.classList.add("active");
        document.querySelector(`[data-panel="${name}"]`).classList.add("active");
    })
})

// ========== 兑换码业务（云端数据库） ==========
async function loadCodeList(){
    const {data,error} = await supabase.from("codes").select("*").order("id",{ascending:false});
    const box = document.getElementById("code-list");
    box.innerHTML="";
    if(error){box.innerHTML="<div class='text-red-400 p-2'>云端读取异常</div>";return;}
    data.forEach(item=>{
        const div = document.createElement("div");
        div.className="list-item";
        div.innerHTML = `
            <span>${item.code}</span>
            <span class="${item.used?"status-red":"status-green"}">${item.used?"已使用":"未使用"}</span>
        `;
        box.appendChild(div);
    })
}

//生成兑换码
document.getElementById("gen-btn").addEventListener("click",async ()=>{
    const reward = document.getElementById("reward-input").value.trim();
    const tipDom = document.getElementById("gen-tip");
    if(!reward){
        tipDom.innerHTML="<div class='tip-error'>请填写奖励内容</div>";
        return;
    }
    let code="";
    const pool = CONFIG.CODE_CHAR_POOL;
    for(let i=0;i<CONFIG.CODE_RAW_LEN;i++){
        code += pool[Math.floor(Math.random()*pool.length)];
    }
    const {error} = await supabase.from("codes").insert({code,reward});
    if(error){
        tipDom.innerHTML=`<div class='tip-error'>生成失败：${error.message}</div>`;
        return;
    }
    tipDom.innerHTML=`<div class='tip-success'>✅ 密钥生成成功：${code}</div>`;
    document.getElementById("reward-input").value="";
    loadCodeList();
})

//兑换执行
document.getElementById("redeem-submit").addEventListener("click",async ()=>{
    const code = document.getElementById("redeem-input").value.trim();
    const tipDom = document.getElementById("redeem-tip");
    if(!code){
        tipDom.innerHTML="<div class='tip-error'>请输入兑换密钥</div>";
        return;
    }
    const {data,error} = await supabase.from("codes").select("*").eq("code",code).single();
    if(error||!data){
        tipDom.innerHTML="<div class='tip-error'>❌ 兑换密钥不存在</div>";
        return;
    }
    if(data.used){
        tipDom.innerHTML="<div class='tip-error'>❌ 该密钥已经被使用</div>";
        return;
    }
    const now = new Date().toLocaleString();
    await supabase.from("codes").update({used:true,use_time:now}).eq("id",data.id);
    tipDom.innerHTML=`<div class='tip-success'>🎉 兑换成功！奖励：${data.reward}</div>`;
    document.getElementById("redeem-input").value="";
    loadCodeList();
})

// ========== 免扫地人员业务 ==========
async function loadCleanList(){
    const {data,error} = await supabase.from("clean").select("*").order("id",{ascending:false});
    const box = document.getElementById("clean-list");
    box.innerHTML="";
    if(error){box.innerHTML="<div class='text-red-400 p-2'>云端读取异常</div>";return;}
    data.forEach(item=>{
        const div = document.createElement("div");
        div.className="list-item";
        div.innerHTML = `
            <span>${item.name}</span>
            <span class="del-btn" data-id="${item.id}"><i class="fa fa-trash"></i> 删除</span>
        `;
        box.appendChild(div);
    })
    document.querySelectorAll(".del-btn").forEach(btn=>{
        btn.onclick = async function(){
            const id = this.dataset.id;
            await supabase.from("clean").delete().eq("id",id);
            loadCleanList();
        }
    })
}

document.getElementById("clean-add-btn").addEventListener("click",async ()=>{
    const name = document.getElementById("clean-name-input").value.trim();
    if(!name) return;
    const {error} = await supabase.from("clean").insert({name});
    if(error){
        alert("⚠️ 添加失败，姓名不能重复");
        return;
    }
    document.getElementById("clean-name-input").value="";
    loadCleanList();
})

</script>
</body>
</html>
